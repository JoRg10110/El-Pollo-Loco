<!DOCTYPE html>
<html translate="no" lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./img/favicon/El Pollo Loco Icon.png" type="image/x-icon">
    <title>El Pollo Loco</title>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/collectable-objects.class.js"></script>

    
    <script src="./models/status-bar-health.class.js"></script>
    <script src="./models/status-bar-coin.class.js"></script>
    <script src="./models/status-bar-bottle.class.js"></script>
    <script src="./models/status-bar-endboss.class.js"></script>
    
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/smallchicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/collectable-bottle.class.js"></script>
    <script src="./models/collectable-coin.class.js"></script>


    <script src="./models/levels.class.js"></script>
    <script src="./levels/level1.js"></script>
    
    <script src="./models/world.class.js"></script>
    
    <script src="./models/keyboard.class.js"></script>
    <script src="./js/sound.js"></script>
    <script src="./js/game.js" ></script>

</head>
<body>
    <h1 id="title">El Pollo Loco</h1>
    
    <div id="rotate-device-overlay" class="d-none">
        <div class="overlay-content">
            <img src="./img/rotation/3293059-200.png" alt="Handy drehen">
            <p>Bitte drehe dein Gerät ins Querformat, um zu spielen!</p>
        </div>
    </div>



    <div id="game-container">
        <div id="start-screen">
            <img class="bg-img" src="./img/9_intro_outro_screens/start/startscreen_1.png">
            <p onclick="startGame()" id="start_btn">Spiel Starten</p>
        </div>

        <div id="game-over-screen" class="d-none">
            <img src="./img/9_intro_outro_screens/game_over/game over.png" height="480px" width="720px">
            <p onclick="restartGame()" id="restart_btn">Restart Game</p>
        </div>

        
        <canvas id="canvas" width="720" height="480"></canvas>

        <div id="top-buttons" class="panel flex-end zero d-none">
            <button class="panel-btn" onclick="goHome()" ><img src="./img/btn/Home.png" alt="">
            </button>
            <button class="panel-btn" onclick="toggleSettingsOverlay()"><img src="./img/btn/Settings.png" alt="">
            </button>
            <button  class="panel-btn" onclick="toggleMute()"><img id="mute-icon" src="./img/btn/Volume.png" alt="">
            </button>
        </div>

        <div id="hud" class="d-none"> 
            <div class="panel zero">
                <div class="panel-wrapper">
                    <button id="btn-Left" class="panel-btn"><img src="./img/btn/Left.png" alt="">
                    </button>
                    <button id="btn-Right" class="panel-btn"><img src="./img/btn/Right.png" alt="">
                    </button>
                </div>
                <div class="panel-wrapper">
                    <button id="btn-Up" class="panel-btn"><img src="./img/btn/Up.png" alt="">
                    </button>
                    <button id="btn-Throw" class="panel-btn"><img src="./img/btn/Throw.png" alt="">
                    </button>
                </div>
            </div>
        </div>

        <div id="settings-overlay" class="d-none">
            <div class="settings-content">
                <h2>Einstellungen</h2>
                <div class="volume-control">
                    <label for="volume-slider">Lautstärke:</label>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" oninput="changeVolume(this.value)">
                </div>
                <button onclick="toggleSettingsOverlay()" class="close-btn">Schließen</button>
            </div>
        </div>
    </div>

    <div id="all-btn" class="d-none">
        <div id="info-btn">
            <img src="./img/btn/left-arrow.png" width="50px" height="50px"> Left
            <img src="./img/btn/right-arrow.png" width="50px" height="50px"> Right
            <img src="./img/btn/space.png" width="50px" height="50px"> Jump
            <img src="./img/btn/letter-d.png" width="50px" height="50px"> Throw
            <!-- <img src="./img/btn/letter-b.png" width="50px" height="50px"> Debug -->

        </div>
        <div id="btn">
            <button onclick="goFullScreen()"><img src="./img/btn/maximize.png" width="30px"></button>
        </div>
    </div>

</body>
</html>
